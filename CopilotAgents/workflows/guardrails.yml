# Copy to .github/workflows/guardrails.yml in the OMS repo. Make the `gates` job a required status check, and require
# CODEOWNERS review on .github/, .claude/, CODEOWNERS and lint/test config (branch protection).
#
# Why pull_request_target: it runs THIS workflow as it exists on the base branch, so a PR cannot weaken the check by
# editing or deleting this file. Security: the PR head is checked out as DATA only — nothing from the PR is executed.
# Semgrep and the Python checks come from the pinned bmad-guardrails tag; they only read files.
name: guardrails
on:
  pull_request_target:
    branches: [develop, main]
    types: [opened, synchronize, reopened, labeled, unlabeled]
permissions:
  contents: read
jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR head as data (no scripts from it are run)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          path: pr
          persist-credentials: false
      - name: Check out pinned guardrails
        uses: actions/checkout@v4
        with:
          repository: umeshkumarkv/bmad-guardrails   # adjust if hosted elsewhere
          ref: v1.4.0                                 # pin a tag; bump only via a reviewed policy PR
          path: guardrails
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Install pinned Semgrep
        run: pip install "semgrep==1.180.0"
      - name: The PR may not touch the controls that judge it
        working-directory: pr
        env:
          GITHUB_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          BMAD_POLICY_PR: ${{ contains(github.event.pull_request.labels.*.name, 'bmad-policy-change') && '1' || '0' }}
        run: |
          git fetch --no-tags origin ${{ github.event.pull_request.base.ref }}
          python3 ../guardrails/gates/checks/protected_paths.py origin/${{ github.event.pull_request.base.ref }} HEAD
      - name: Deterministic gates (Semgrep + structure + domain), nosemgrep ignored
        # Large monorepo: add `--changed-from origin/<base>` to scan only the services this PR touches.
        run: python3 guardrails/gates/run_gates.py pr --baseline guardrails/gates/baseline.json
      - uses: actions/cache/restore@v4   # READ-ONLY: PR runs never write the cache (see impact-cache.yml)
        with:
          path: ~/.cache/bmad-impact
          key: bmad-impact-${{ github.event.pull_request.base.ref }}-${{ github.event.pull_request.base.sha }}
          restore-keys: bmad-impact-${{ github.event.pull_request.base.ref }}-
      - name: Cross-service impact — fail if a counterpart is left pointing at something removed
        working-directory: pr
        run: |
          pip install "pyyaml==6.0.2"
          python3 ../guardrails/impact/impact.py --repo . --base origin/${{ github.event.pull_request.base.ref }} \
            --cache ~/.cache/bmad-impact --json ../impact.json --fail-on-breaking
      # ArchUnit runs inside the normal `mvn verify` once OmsArchitectureTest is added to each service.
